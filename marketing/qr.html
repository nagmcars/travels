<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوستات كود QR - شركة نجم كار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@500;700&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
@page { size: 200mm 200mm; margin: 0; }
:root {
  --navy: #121838; --gold: #F4C247; --wa: #1FA855;
  --display: "Lalezar", "IBM Plex Sans Arabic", sans-serif; --body: "IBM Plex Sans Arabic", sans-serif;
}
.navy  { --bg: radial-gradient(90% 55% at 50% 0%, #23307A, #0F1433 72%); --fg: #F4F1E8; --accent: #F4C247; }
.gold  { --bg: linear-gradient(170deg, #FFD566, #F4C247 55%, #E9AE2A); --fg: #121838; --accent: #121838; }
.cream { --bg: #FFF8E6; --fg: #121838; --accent: #B9800F; }
.stripe { --bg: repeating-linear-gradient(135deg, #121838 0 90px, #18205A 90px 180px); --fg: #F4F1E8; --accent: #F4C247; }
.sunset { --bg: linear-gradient(180deg, #2B1B5A 0%, #A23B5C 55%, #F28C38 100%); --fg: #fff; --accent: #FFD566; }
* { box-sizing: border-box; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: var(--body); overflow: hidden; }
.ph { width: 100%; height: 100%; object-fit: cover; display: block; }

/* QR card: plain black-on-white with a quiet zone, no overlay, so any phone camera reads it. */
.qr-card { background: #fff; border-radius: 26px; padding: 18px 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 0 0 6px var(--gold), 0 18px 40px rgba(0,0,0,.45); }
.qr-card .code { width: var(--qr, 360px); height: var(--qr, 360px); }
.qr-card .code svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
.qr-card p { color: var(--navy); font-family: var(--display); font-size: 34px; line-height: 1.1; text-align: center; }

/* ---------- posts 1080×1350 ---------- */
.post { width: 1080px; height: 1350px; padding: 40px 48px 34px; display: flex; flex-direction: column; gap: 20px; color: var(--fg); background: var(--bg); }
.brand { align-self: center; display: flex; align-items: center; gap: 14px; background: var(--navy); color: var(--gold); padding: 10px 30px 10px 34px; border-radius: 999px; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.brand img { height: 58px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 112px; line-height: 1; text-align: center; color: var(--accent); }
.sub { text-align: center; font-size: 36px; font-weight: 700; margin-top: -6px; }
main { flex: 1; min-height: 0; display: grid; gap: 12px; }
.car { position: relative; border-radius: 22px; overflow: hidden; border: 4px solid var(--accent); min-height: 0; }
.car span { position: absolute; right: 8px; bottom: 8px; background: var(--navy); color: var(--gold); font-weight: 700; font-size: 20px; padding: 3px 12px; border-radius: 999px; border: 2px solid var(--gold); white-space: nowrap; }
.slot { display: grid; place-items: center; min-height: 0; }

/* ring: QR in the middle of 8 cars */
.ring { grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
.ring .slot { grid-area: 2 / 2; position: relative; z-index: 1; }
.ring .qr-card { --qr: 300px; padding: 12px 12px 8px; }
.ring .qr-card p { font-size: 26px; }
/* side: QR column beside a stack of cars */
.side { grid-template: repeat(4, 1fr) / 1fr 1fr; }
.side .slot { grid-row: 1 / -1; grid-column: 1; }
.side .car { grid-column: 2; }
.side .qr-card { --qr: 400px; }
/* top: car grid above, QR below with the pitch beside it */
.top { grid-template: 1fr 1fr 1.7fr / repeat(3, 1fr); }
.top .slot { grid-column: 1 / -1; display: flex; gap: 30px; justify-content: center; }
.top .qr-card { --qr: 380px; }
.top .pitch { display: grid; gap: 12px; font-size: 34px; font-weight: 700; }
.top .pitch span::before { content: "✓ "; color: var(--accent); }
/* sandwich: cars row, QR, cars row */
.sandwich { grid-template: 1fr 2.2fr 1fr / repeat(4, 1fr); }
.sandwich .slot { grid-column: 1 / -1; }
.sandwich .qr-card { --qr: 400px; flex-direction: row; gap: 26px; padding: 16px 26px 16px 16px; }
.sandwich .qr-card p { font-size: 46px; }

.cta { display: flex; align-items: center; justify-content: space-between; background: var(--wa); color: #fff; border-radius: 26px; padding: 14px 30px; }
.cta .lbl { display: flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 700; }
.cta svg { width: 50px; height: 50px; }
.cta .num { direction: ltr; font-family: var(--display); font-size: 60px; line-height: 1; }
.link { text-align: center; font-size: 30px; font-weight: 700; margin-top: -8px; }
.link b { direction: ltr; unicode-bidi: isolate; }

/* ---------- car window sticker 200×200 mm ---------- */
.sticker { width: 200mm; height: 200mm; background: var(--navy); color: #fff; padding: 9mm; display: flex; flex-direction: column; align-items: center; gap: 4mm; }
.sticker .head { display: flex; align-items: center; gap: 4mm; }
.sticker .head img { height: 20mm; }
.sticker .head b { font-family: var(--display); font-weight: 400; font-size: 15mm; line-height: 1; color: var(--gold); }
.sticker .qr-card { --qr: 100mm; border-radius: 5mm; padding: 5mm 5mm 3mm; box-shadow: 0 0 0 1.5mm var(--gold); }
.sticker .qr-card p { font-size: 9mm; }
.sticker .row { display: flex; align-items: center; gap: 3mm; font-size: 6mm; font-weight: 700; }
.sticker .row svg { width: 9mm; height: 9mm; color: var(--wa); }
.sticker .row strong { direction: ltr; font-family: var(--display); font-weight: 400; font-size: 13mm; line-height: 1; }
.sticker .site { direction: ltr; font-size: 5mm; font-weight: 700; opacity: .85; }
/* viewfinder corners around a QR */
.vf { position: relative; padding: 14px; }
.vf i { position: absolute; width: 54px; height: 54px; border: 0 solid var(--gold); }
.vf i:nth-of-type(1) { top: 0; right: 0; border-width: 8px 8px 0 0; border-radius: 0 18px 0 0; }
.vf i:nth-of-type(2) { top: 0; left: 0; border-width: 8px 0 0 8px; border-radius: 18px 0 0 0; }
.vf i:nth-of-type(3) { bottom: 0; right: 0; border-width: 0 8px 8px 0; border-radius: 0 0 18px 0; }
.vf i:nth-of-type(4) { bottom: 0; left: 0; border-width: 0 0 8px 8px; border-radius: 0 0 0 18px; }
.qrw { background: #fff; padding: 12px; border-radius: 16px; }
.qrw .code { width: var(--qr, 340px); height: var(--qr, 340px); }
.qrw .code svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }

/* phone scanning */
.phone { grid-template: 1fr 1fr / 1fr 460px 1fr; }
.phone .car:nth-child(1) { grid-area: 1 / 1; } .phone .car:nth-child(2) { grid-area: 2 / 1; }
.phone .car:nth-child(3) { grid-area: 1 / 3; } .phone .car:nth-child(4) { grid-area: 2 / 3; }
.device { grid-area: 1 / 2 / 3 / 3; background: #0A0A12; border-radius: 64px; padding: 16px; box-shadow: 0 0 0 4px #3A3F55, 0 24px 50px rgba(0,0,0,.5); position: relative; }
.device .screen { height: 100%; border-radius: 50px; overflow: hidden; position: relative; display: grid; place-items: center; }
.device .screen > img { position: absolute; inset: 0; filter: blur(3px) brightness(.55); }
.device .notch { position: absolute; top: 26px; left: 50%; width: 130px; height: 34px; margin-left: -65px; background: #0A0A12; border-radius: 20px; z-index: 2; }
.device .vf { z-index: 1; --qr: 300px; }
.device .toast { position: absolute; z-index: 1; bottom: 30px; left: 20px; right: 20px; background: rgba(255,255,255,.95); color: var(--navy); border-radius: 22px; padding: 12px 16px; text-align: center; font-weight: 700; font-size: 24px; line-height: 1.3; }
.device .toast b { display: block; direction: ltr; color: #1A73E8; }
.device .hint { position: absolute; z-index: 1; top: 84px; left: 0; right: 0; text-align: center; color: #fff; font-weight: 700; font-size: 28px; }

/* ticket with QR stub */
.ticket2 { grid-template-rows: minmax(0, 1fr) auto; background: #FFFDF6; color: var(--navy); border-radius: 34px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.35); gap: 0; }
.ticket2 .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; background: var(--navy); min-height: 0; }
.ticket2 .strip .car { border-width: 0; border-radius: 18px; }
.ticket2 .body { display: grid; grid-template-columns: 1fr auto auto; align-items: center; }
.ticket2 .info { padding: 20px 34px; display: grid; gap: 6px; }
.ticket2 .info small { font-size: 26px; font-weight: 700; color: #8A6A1F; }
.ticket2 .info b { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; }
.ticket2 .info span { font-size: 30px; font-weight: 700; }
.ticket2 .perf { align-self: stretch; width: 0; border-inline-start: 6px dashed #D9CFB4; margin: 18px 0; }
.ticket2 .stub { padding: 18px 26px; display: grid; justify-items: center; gap: 4px; }
.ticket2 .stub p { font-family: var(--display); font-size: 32px; }
.ticket2 .qrw { --qr: 320px; padding: 0; }

/* egyptian plate */
.plateq { grid-template-rows: auto minmax(0, 1fr); }
.bigplate { background: #F7F7F2; border: 14px solid #1C1C1C; border-radius: 30px; overflow: hidden; display: grid; grid-template-rows: 100px auto; box-shadow: 0 18px 40px rgba(0,0,0,.4); direction: ltr; }
.bigplate .band { background: #74C3E6; border-bottom: 10px solid #1C1C1C; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; color: #111; }
.bigplate .band b { font-size: 60px; letter-spacing: 6px; font-family: Arial, sans-serif; font-weight: 900; }
.bigplate .band span { font-family: var(--display); font-size: 76px; }
.bigplate .row { display: grid; grid-template-columns: auto 10px 1fr; align-items: center; }
.bigplate .row .sep { background: #1C1C1C; align-self: stretch; }
.bigplate .row .qrw { --qr: 320px; border-radius: 0; padding: 16px 26px; background: transparent; }
.bigplate .letters { direction: rtl; text-align: center; font-family: var(--display); font-size: 180px; color: #111; letter-spacing: 20px; line-height: 1; }
.bigplate .letters small { display: block; font-family: var(--body); font-size: 34px; letter-spacing: 0; font-weight: 700; color: #333; }
.cars4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; min-height: 0; }

/* road sign */
.signq { grid-template-rows: auto minmax(0, 1fr) auto; }
.gsign { background: #0B6B3A; border-radius: 30px; padding: 12px; box-shadow: 0 16px 36px rgba(0,0,0,.35); }
.gsign > div { border: 6px solid #fff; border-radius: 22px; padding: 18px 26px; display: grid; grid-template-columns: 1fr auto; gap: 26px; align-items: center; color: #fff; }
.gsign h2 { font-family: var(--display); font-weight: 400; font-size: 96px; line-height: 1; }
.gsign p { font-size: 34px; font-weight: 700; margin-top: 8px; }
.gsign svg.arrow { width: 110px; height: 110px; }
.gsign .qrw { --qr: 310px; }
.cars3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; min-height: 0; }
.chips { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.chips span { font-size: 30px; font-weight: 700; padding: 8px 22px; border-radius: 999px; border: 3px solid currentColor; }

/* pinboard */
.pins { position: relative; display: block; }
.pin { position: absolute; background: #fff; padding: 12px 12px 54px; border-radius: 6px; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pin p { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: var(--display); font-size: 32px; color: var(--navy); }
.pin::before { content: ""; position: absolute; top: -16px; left: 50%; width: 120px; height: 36px; margin-left: -60px; background: rgba(244,194,71,.85); transform: rotate(-3deg); }
.pin.c { width: 360px; height: 300px; }
.pin.q { left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg); z-index: 2; padding: 14px 14px 60px; }
.pin.q .qrw { --qr: 360px; padding: 0; }

/* departures board + QR */
.boardq { grid-template-columns: 1fr auto; grid-template-rows: auto minmax(0, 1fr); align-items: center; }
.board { background: #141414; border: 8px solid #2A2A2A; border-radius: 26px; overflow: hidden; }
.board .bar { display: flex; justify-content: space-between; background: #222; color: #FFB020; padding: 10px 24px; font-size: 26px; font-weight: 700; }
.board .r { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 24px; border-top: 2px solid #2C2C2C; gap: 10px; }
.board .r span { font-family: var(--display); font-size: 42px; color: #FFB020; line-height: 1.1; }
.board .r strong { font-family: var(--display); font-weight: 400; font-size: 42px; color: #3DDC6E; }
.qcol { display: grid; justify-items: center; gap: 8px; }
.qcol p { font-family: var(--display); font-size: 36px; color: var(--accent); }
.boardq .qrw { --qr: 290px; }
.boardq .cars3 { grid-column: 1 / -1; align-self: stretch; }

/* chat */
.chatq { background: #ECE5DD; border-radius: 34px; padding: 18px 24px; display: flex; flex-direction: column; gap: 12px; color: #111; box-shadow: 0 16px 36px rgba(0,0,0,.3); overflow: hidden; min-height: 0; }
.chatq .head { display: flex; align-items: center; gap: 14px; background: #075E54; color: #fff; margin: -18px -24px 2px; padding: 14px 24px; font-size: 30px; font-weight: 700; }
.chatq .head img { height: 44px; width: 56px; object-fit: contain; background: var(--navy); border-radius: 50%; padding: 5px; }
.msg { max-width: 80%; padding: 10px 18px; border-radius: 20px; font-size: 30px; font-weight: 500; line-height: 1.35; box-shadow: 0 2px 2px rgba(0,0,0,.08); }
.msg.me { align-self: flex-end; background: #DCF8C6; }
.msg.us { align-self: flex-start; background: #fff; }
.msg.qrm { padding: 10px; display: flex; gap: 16px; align-items: center; max-width: 92%; }
.msg.qrm .qrw { --qr: 310px; padding: 4px; }
.msg.qrm p { font-size: 30px; font-weight: 700; }
.msg.pics { flex: 1; min-height: 0; max-width: 92%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
.msg.pics .car { border-width: 0; border-radius: 14px; }

/* big number / driving */
.bigq { grid-template: auto minmax(0, 1fr) / 1fr auto; align-items: center; }
.bigq .num { display: flex; align-items: center; gap: 18px; }
.bigq .num strong { font-family: var(--display); font-weight: 400; font-size: 330px; line-height: .8; color: var(--accent); }
.bigq .num p { font-family: var(--display); font-size: 72px; line-height: 1.05; }
.bigq .num p small { display: block; font-family: var(--body); font-size: 30px; font-weight: 700; margin-top: 8px; }
.bigq .qrw { --qr: 290px; }
.bigq .cars4 { grid-column: 1 / -1; grid-template: 1fr 1fr / 1fr 1fr; align-self: stretch; }
.learner { display: inline-grid; place-items: center; width: 160px; height: 160px; background: #fff; color: #D7263D; border: 10px solid #D7263D; border-radius: 26px; font-family: var(--display); font-size: 120px; line-height: 1; flex: none; }
</style>
</head>

<symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2Zm4.52 11.99c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></symbol>
</svg>
<script>
const PHONE = "01043950220";
const SITE_URL = "https://nagmcars.github.io/travels/";
const SITE = "nagmcars.github.io/travels";

const CARS = {
  elantra:  ["هيونداي إلنترا", "hyundai", "center 62%"],
  octavia:  ["سكودا أوكتافيا", "skoda", "62% 62%"],
  sunny:    ["نيسان صني", "nissan", "center 62%"],
  fortuner: ["تويوتا فورتشنر", "toyota", "62% 55%"],
  cerato:   ["كيا سيراتو", "kia", "72% 60%"],
  peugeot:  ["بيجو 301", "peugeot", "30% 60%"],
  lancer:   ["ميتسوبيشي لانسر", "mitsubishi", "55% 60%"],
  corolla:  ["تويوتا كورولا", "toyota", "center 62%"],
  mgzs:     ["إم جي ZS", "mg", "30% 60%"],
  accent:   ["هيونداي أكسنت", "hyundai", "62% 55%"],
  sentra:   ["نيسان سنترا", "nissan", "40% 58%"],
  optra:    ["شيفروليه أوبترا", "chevrolet", "68% 50%"],
  camry:    ["تويوتا كامري", "toyota", "60% 55%"],
  sportage: ["كيا سبورتاج", "kia", "30% 60%"],
  tucson:   ["هيونداي توسان", "hyundai", "35% 58%"],
  hiace:    ["تويوتا هايس", "toyota", "center 62%"],
};
const ORDER = Object.keys(CARS);
let cursor = 0;
// No post repeats a brand; with 9 brands, 8 cars is the most a post can take.
const pickCars = (count) => {
  const out = [];
  const brands = new Set();
  while (out.length < count) {
    const c = ORDER[cursor++ % ORDER.length];
    if (brands.has(CARS[c][1])) continue;
    out.push(c);
    brands.add(CARS[c][1]);
  }
  return out;
};
const tile = (c) => `<div class="car"><img class="ph" src="../images/${c}.jpg" style="object-position:${CARS[c][2]}" alt=""><span>${CARS[c][0]}</span></div>`;

const qrSvg = (url) => {
  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 3, scalable: true });
};
const qrCard = (url, label) => `<div class="qr-card"><div class="code">${qrSvg(url)}</div><p>${label}</p></div>`;


const qrw = (url = SITE_URL) => `<div class="qrw"><div class="code">${qrSvg(url)}</div></div>`;
const vf = (url) => `<div class="vf"><i></i><i></i><i></i><i></i>${qrw(url)}</div>`;
const tiles = (p) => p.cars.map(tile).join("");
const ROUTES = [["طنطا ← مطار القاهرة", 1500], ["كفر الزيات ← المطار", 1700], ["طنطا ← المنصورة", 900], ["كفر الزيات ← إسكندرية", 1000], ["طنطا ← شرم الشيخ", 6600]];
const money = (n) => n.toLocaleString("en-US");
const ARROW = '<svg class="arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M10.6 4.6 3.2 12l7.4 7.4 1.8-1.8L8.1 13.3H21v-2.6H8.1l4.3-4.3z"/></svg>';
const PIN_SPOTS = [["top:10px;right:0", 5], ["top:10px;left:0", -5], ["bottom:0;right:20px", -3], ["bottom:0;left:20px", 4]];

const POSTS = [
  { layout: "ring", theme: "navy", title: "امسح وشوف الأسعار", sub: "كل المشاوير وأسعارها والحجز في مكان واحد", n: 8 },
  { layout: "phone", theme: "gold", title: "وجّه الكاميرا وبس", sub: "والموقع هيفتحلك على طول", n: 4 },
  { layout: "ticket", theme: "stripe", title: "تذكرتك للأسعار", sub: "امسح الكود اللي على التذكرة", n: 3 },
  { layout: "plate", theme: "cream", title: "نمرتنا فيها الأسعار", sub: "امسح النمرة وشوف كل المشاوير", n: 4 },
  { layout: "sign", theme: "navy", title: "رايح فين؟", sub: "اليافطة دي هتوصلك للأسعار", n: 3 },
  { layout: "pins", theme: "sunset", title: "عربياتنا والأسعار", sub: "امسح الصورة اللي في النص", n: 4 },
  { layout: "board", theme: "stripe", title: "رحلات النهارده", sub: "وباقي الأسعار في الكود", n: 3 },
  { layout: "chat", theme: "cream", title: "عايز الأسعار؟", sub: "بنبعتهالك في كود واحد", n: 3 },
  { layout: "driving", theme: "gold", title: "تعليم سواقة", sub: "امسح الكود واحجز حصتك", n: 4 },
  { layout: "big", theme: "navy", title: "حسبتها؟", sub: "امسح واحسب سعر مشوارك", n: 4 },
].map((p) => ({ ...p, cars: pickCars(p.n) }));

const LAYOUTS = {
  ring: (p) => {
    const t = p.cars.map(tile);
    return [...t.slice(0, 4), `<div class="slot"><div class="qr-card"><div class="code">${qrSvg(SITE_URL)}</div><p>امسح بالكاميرا</p></div></div>`, ...t.slice(4)].join("");
  },
  phone: (p) => tiles(p) + `<div class="device"><div class="screen"><img class="ph" src="../images/${p.cars[0]}.jpg" alt=""><span class="hint">امسح الكود</span>${vf()}<div class="toast">افتح الموقع<b>nagmcars.github.io</b></div></div><span class="notch"></span></div>`,
  ticket: (p) => `<div class="strip">${tiles(p)}</div><div class="body"><div class="info"><small>من</small><b>أي مكان</b><small>إلى</small><b>أي محافظة</b><span>ملاكي وهايس · سعر ثابت</span></div><div class="perf"></div><div class="stub">${qrw()}<p>امسح الكود</p></div></div>`,
  plate: (p) => `<div class="bigplate"><div class="band"><b>EGYPT</b><span>مصر</span></div><div class="row">${qrw()}<i class="sep"></i><div class="letters">ن ج م<small>امسح النمرة ←</small></div></div></div><div class="cars4">${tiles(p)}</div>`,
  sign: (p) => `<div class="gsign"><div><div>${ARROW}<h2>الأسعار والحجز</h2><p>امسح الكود</p></div>${qrw()}</div></div><div class="cars3">${tiles(p)}</div><div class="chips"><span>المطار</span><span>كل المحافظات</span><span>من الباب للباب</span></div>`,
  pins: (p) => p.cars.map((c, i) => `<div class="pin c" style="${PIN_SPOTS[i][0]};transform:rotate(${PIN_SPOTS[i][1]}deg)"><img src="../images/${c}.jpg" style="object-position:${CARS[c][2]}" alt=""><p>${CARS[c][0]}</p></div>`).join("")
    + `<div class="pin q">${qrw()}<p>امسح هنا</p></div>`,
  board: (p) => `<div class="board"><div class="bar"><span>الوجهة</span><span>ذهاب</span></div>${ROUTES.map(([r, v]) => `<div class="r"><span>${r}</span><strong>${money(v)}</strong></div>`).join("")}</div><div class="qcol">${vf()}<p>باقي الأسعار</p></div><div class="cars3">${tiles(p)}</div>`,
  chat: (p) => `<div class="chatq"><div class="head"><img src="../images/logo.svg" alt="">شركة نجم كار</div><div class="msg me">مساء الخير، ممكن أسعار المشاوير؟</div><div class="msg us qrm">${qrw()}<p>أكيد! امسح الكود ده وهتلاقي كل الأسعار والعربيات 👇</p></div><div class="msg us pics">${tiles(p)}</div><div class="msg me">تمام، شكراً 👍</div></div>`,
  driving: (p) => `<div class="num"><span class="learner">ل</span><p>من الصفر<br>لحد الطريق<small>أوتوماتيك ومانيوال</small></p></div><div class="qcol">${vf(SITE_URL + "#driving")}<p>احجز حصتك</p></div><div class="cars4">${tiles(p)}</div>`,
  big: (p) => `<div class="num"><strong>12</strong><p>جنيه<br>للكيلو<small>والهايس +10% بس</small></p></div><div class="qcol">${qrw()}<p>احسب مشوارك</p></div><div class="cars4">${tiles(p)}</div>`,
};
const MAIN_CLASS = { ring: "ring", phone: "phone", ticket: "ticket2", plate: "plateq", sign: "signq", pins: "pins", board: "boardq", chat: "", driving: "bigq", big: "bigq" };

const params = new URLSearchParams(location.search);
if (params.get("v") === "sticker") {
  document.body.className = "sticker";
  document.body.insertAdjacentHTML("beforeend", `
    <div class="head"><img src="../images/logo.svg" alt=""><b>شركة نجم كار</b></div>
    ${qrCard(SITE_URL, "امسح واحجز مشوارك")}
    <div class="row"><svg><use href="#wa"/></svg>واتساب واتصال <strong>${PHONE}</strong></div>
    <p class="site">${SITE}</p>`);
} else {
  const p = POSTS[Number(params.get("n") ?? 1) - 1];
  document.body.className = `post ${p.theme}`;
  document.body.insertAdjacentHTML("beforeend", `
    <header class="brand"><img src="../images/logo.svg" alt=""><b>شركة نجم كار</b></header>
    <h1>${p.title}</h1>
    <p class="sub">${p.sub}</p>
    <main class="${MAIN_CLASS[p.layout]}">${LAYOUTS[p.layout](p)}</main>
    <div class="cta"><span class="lbl"><svg><use href="#wa"/></svg>أو احجز على واتساب</span><span class="num">${PHONE}</span></div>
    <p class="link"><b>${SITE}</b></p>`);
}
</script>
</body>
</html>
